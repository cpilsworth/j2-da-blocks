name = "j2api"
main = "src/index.js"
compatibility_date = "2026-05-14"

# The worker listens on PROXY_PATH and proxies to UPSTREAM_BASE + UPSTREAM_PATH.
# UPSTREAM_PATH is the path on the upstream provider's host (third-party, not
# ours), while PROXY_PATH is the path our worker exposes publicly.

[vars]
UPSTREAM_BASE = "https://www.jet2holidays.com"
UPSTREAM_PATH = "/api/jet2/hotels/getfilteredhotels"
PROXY_PATH = "/api/j2/hotels/getfilteredhotels"
CACHED_PATH = "/api/j2/hotels/getcachedhotels"

[[rules]]
type = "Text"
globs = ["**/*.yaml"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "j2api-cache"
database_id = "270ed787-0236-41d2-8368-2a459761abe8"
